name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/obrera/nightshift-086-briefdock:latest
            ghcr.io/obrera/nightshift-086-briefdock:${{ github.sha }}
      - name: Trigger Dokploy
        if: ${{ secrets.DOKPLOY_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
